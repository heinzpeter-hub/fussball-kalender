name: Kalender aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"     # täglich ca. 5:17 Uhr deutscher Zeit
  workflow_dispatch:          # manueller Start-Button auf GitHub
  push:
    branches: [main]
    paths: ["build_ics.py"]   # läuft auch nach Änderungen am Skript

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python build_ics.py

      - name: Stand im Repository speichern
        run: |
          git config user.name "kalender-bot"
          git config user.email "kalender-bot@users.noreply.github.com"
          git add docs
          git commit -m "Kalender aktualisiert" || echo "Keine Änderung"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4